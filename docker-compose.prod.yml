version: '3.8'

services:
  bot:
    build: .
    container_name: robak_changer_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - .:/app:ro
      - bot_data:/data
    # If your bot exposes an HTTP port (e.g. webhook), uncomment and set the port
    # ports:
    #   - "8000:8000"

  # Optional simple reverse proxy using Caddy (automatic TLS)
  # Uncomment if you want an easy TLS-enabled proxy. Provide a Caddyfile.
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config

volumes:
  bot_data:
  caddy_data:
  caddy_config:
