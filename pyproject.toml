[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robak-changer"
version = "0.1.0"
description = "Discord bot for generating and managing nicknames"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
  "discord.py>=2.0.0",
  "python-dotenv>=0.21.0"
]

[project.urls]
"Homepage" = "https://example.com/robak_changer"

[project.scripts]
robak-changer = "main:main"

[tool.setuptools]
py-modules = ["bot", "main", "config", "logger", "commands", "utils", "essentials"]
