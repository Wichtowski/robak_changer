[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robak-changer"
version = "2.0"
description = "Discord bot for generating and managing nicknames"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "wichtowski", email = "oskar.wichtowski3@gmail.com" }
]

dependencies = [
  "discord.py>=2.0.0",
  "dotenv>=0.9.9",
  "python-dotenv>=0.21.0",
]

[project.urls]
"Homepage" = "https://example.com/robak_changer"

[project.scripts]
robak-changer = "robak.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff>=0.11.0"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["__pycache__", ".venv", "build", "dist", ".git"]
[tool.ruff.lint]
extend-ignore = ["E203"]
